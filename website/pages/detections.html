<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detections — Smart Camera</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <style>
    /* ── Detection Gallery ───────────────────────── */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
      padding: 1.25rem;
    }

    .det-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: box-shadow .2s, transform .2s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .det-card:hover {
      box-shadow: 0 8px 24px rgba(0,0,0,.13);
      transform: translateY(-2px);
      color: inherit;
    }

    .det-card-thumb {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      background: #0f172a;
      display: block;
    }
    .det-card-thumb-placeholder {
      width: 100%;
      aspect-ratio: 16/10;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: #334155;
    }

    /* object-count overlay on top-right of image */
    .det-card-img-wrap { position: relative; }
    .det-count-badge {
      position: absolute;
      top: 7px; right: 8px;
      background: rgba(0,0,0,.65);
      color: #fff;
      font-size: .72rem;
      font-weight: 700;
      padding: .2rem .5rem;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }

    .det-card-body {
      padding: .75rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: .3rem;
    }

    .det-card-filename {
      font-size: .78rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .det-card-classes {
      display: flex;
      flex-wrap: wrap;
      gap: .25rem;
      min-height: 20px;
    }

    .det-card-meta {
      font-size: .72rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: .3rem;
    }

    /* ── Pagination ─────────────────────────────── */
    .paging-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .875rem 1.25rem;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      gap: .5rem;
    }
    .paging-info { font-size: .82rem; color: var(--text-muted); }
    .paging-btns { display: flex; gap: .25rem; align-items: center; }

    .pg-btn {
      min-width: 34px; height: 34px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      font-size: .82rem;
      color: var(--text);
      cursor: pointer;
      padding: 0 .5rem;
      transition: all .15s;
      user-select: none;
    }
    .pg-btn:hover:not(:disabled):not(.active) {
      background: var(--primary); color: #fff; border-color: var(--primary);
    }
    .pg-btn.active {
      background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 700;
    }
    .pg-btn:disabled { opacity: .38; cursor: not-allowed; }
    .pg-btn.pg-nav { font-size: 1rem; font-weight: 700; }

    /* ── Empty state ─────────────────────────────── */
    .gallery-empty {
      grid-column: 1 / -1;
      padding: 3.5rem 1rem;
      text-align: center;
      color: var(--text-muted);
    }
    .gallery-empty .ei { font-size: 2.8rem; margin-bottom: .6rem; }
    .gallery-empty .et { font-weight: 600; margin-bottom: .2rem; font-size: .95rem; }
    .gallery-empty .es { font-size: .82rem; }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon">📷</div>
    <div>
      <div class="brand-name">Smart Camera</div>
      <div class="brand-sub">YOLO Detection System</div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">Menu</div>
    <a href="../index.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
    <a href="raw-images.html" class="nav-item"><span class="nav-icon">🖼️</span> Raw Images</a>
    <a href="detections.html" class="nav-item active"><span class="nav-icon">🔍</span> Detections</a>
    <a href="devices.html"    class="nav-item"><span class="nav-icon">📡</span> Devices</a>
    <div class="nav-section mt-3">System</div>
    <a href="/api-docs" target="_blank" class="nav-item"><span class="nav-icon">📑</span> API Docs</a>
    <a href="/health"   target="_blank" class="nav-item"><span class="nav-icon">💚</span> Health Check</a>
  </nav>
</aside>

<!-- Main -->
<div class="main-wrapper">
  <header class="topbar">
    <div>
      <div class="topbar-title">Detections</div>
      <div class="topbar-sub">Hasil deteksi objek YOLO — terbaru ke terlama</div>
    </div>
    <div class="topbar-right">
      <span class="status-dot"></span>
      <button class="refresh-btn" id="btn-refresh">↻ Refresh</button>
    </div>
  </header>

  <main class="page-content">
    <div id="toast-container" style="position:fixed;top:1rem;right:1rem;z-index:9999;min-width:300px;"></div>

    <div class="card" style="position:relative">
      <!-- Loading -->
      <div id="loading-overlay" class="spinner-overlay" style="display:none">
        <div class="spinner"></div>
      </div>

      <!-- Filters -->
      <div class="filter-bar">
        <div class="filter-group">
          <label>Device ID</label>
          <input type="text" id="f-device" class="filter-input" placeholder="CAM-P016">
        </div>
        <div class="filter-group">
          <label>Class Object</label>
          <input type="text" id="f-class" class="filter-input" placeholder="car, person...">
        </div>
        <div class="filter-group">
          <label>Tanggal Mulai</label>
          <input type="date" id="f-start" class="filter-input">
        </div>
        <div class="filter-group">
          <label>Tanggal Akhir</label>
          <input type="date" id="f-end" class="filter-input">
        </div>
        <button class="filter-btn filter-btn-primary" id="btn-search">🔍 Cari</button>
        <button class="filter-btn filter-btn-secondary" id="btn-reset">↺ Reset</button>
      </div>

      <!-- Gallery -->
      <div class="gallery-grid" id="gallery-grid">
        <div class="gallery-empty">
          <div class="ei">🔍</div>
          <div class="et">Klik Refresh untuk memuat deteksi</div>
          <div class="es">Data akan ditampilkan dari terbaru ke terlama</div>
        </div>
      </div>

      <!-- Pagination -->
      <div class="paging-bar" id="paging-bar" style="display:none">
        <span class="paging-info" id="page-info">—</span>
        <div class="paging-btns" id="pagination"></div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/detections.js"></script>
</body>
</html>
